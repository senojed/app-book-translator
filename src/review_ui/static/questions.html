<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Otevřené otázky</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 1.5rem;
        background: #f7f7f5; color: #1a1a1a; }
  h1 { font-size: 1.3rem; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  td, th { padding: .5rem .6rem; border-bottom: 1px solid #eee; text-align: left;
          vertical-align: top; }
  .badge { display: inline-block; padding: .1rem .5rem; border-radius: 3px;
          font-size: .75rem; font-weight: 600; margin-right: .3rem; }
  .badge-guess { background: #eef; color: #33c; }
  .badge-blocking { background: #fee; color: #b3261e; }
  .scope { color: #666; font-size: .85rem; }
  input[type=text] { width: 100%; box-sizing: border-box; padding: .3rem .4rem;
                     font-size: .85rem; border: 1px solid #ccc; border-radius: 4px;
                     margin-bottom: .35rem; }
  button { cursor: pointer; border: 1px solid #ccc; background: #fff;
          border-radius: 4px; padding: .35rem .7rem; font-size: .85rem;
          margin-right: .3rem; margin-bottom: .3rem; }
  button.primary { background: #1a6b3c; color: #fff; border-color: #1a6b3c; }
  button.ghost { background: #fff; color: #555; }
  button.danger-ghost { background: #fff; color: #b3261e; border-color: #f3c; }
  button.small { padding: .15rem .5rem; font-size: .75rem; }
  button.chip { background: #f0f0ee; border-color: #ddd; font-size: .8rem;
               padding: .15rem .55rem; }
  button.chip.active { background: #1a6b3c; color: #fff; border-color: #1a6b3c; }
  .row-msg { font-size: .8rem; margin-top: .3rem; }
  .row-msg.error { color: #b3261e; }
  .row-msg.ok { color: #1a6b3c; }
  .row.done { opacity: .4; }
  .row.discuss { background: #fff8e1; }
  .row.discuss .scope::after { content: " · k diskuzi"; color: #a66; }
  .chips { margin-bottom: .35rem; }
  .action-row { display: flex; flex-wrap: wrap; align-items: center; }
  #banner { font-size: .9rem; margin-bottom: 1rem; padding: .5rem .7rem;
           border-radius: 4px; background: #eef; color: #224; display: none; }
  #banner.show { display: block; }
  #empty { color: #888; }
</style>
</head>
<body>
<h1>Otevřené otázky</h1>
<div id="banner"></div>
<p id="empty" style="display:none">Žádné otevřené otázky.</p>
<table id="q-table">
  <thead><tr><th>Rozsah</th><th>Otázka</th><th>Odpověď</th><th></th></tr></thead>
  <tbody id="q-body"></tbody>
</table>

<script>
function el(tag, opts, children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(opts || {})) {
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else e.setAttribute(k, v);
  }
  for (const c of children || []) e.appendChild(c);
  return e;
}

function showBanner(text) {
  const b = document.getElementById('banner');
  b.textContent = text;
  b.classList.add('show');
}

// Per-viewer "k diskuzi" flag - NENÍ perzistováno na serveru (žádná DB
// změna, žádný sdílený stav), jen připomínka pro tenhle prohlížeč mezi
// reloady. Obalené try/catch - private mode / zablokované úložiště nesmí
// stránku shodit.
const DISCUSS_KEY = 'bt-questions-discuss';
function loadDiscussSet() {
  try {
    return new Set(JSON.parse(localStorage.getItem(DISCUSS_KEY) || '[]'));
  } catch (e) { return new Set(); }
}
function saveDiscussSet(set) {
  try { localStorage.setItem(DISCUSS_KEY, JSON.stringify([...set])); } catch (e) {}
}
const discussSet = loadDiscussSet();

// "Sedí to?" otázky nemají co přepisovat - guess_answer je hotová odpověď,
// stačí potvrdit/odmítnout jedním klikem.
function isConfirmQuestion(text) {
  return /sedí to\?\s*$/i.test(text.trim());
}

// Drift otázky ("Termín se překládá různě: A, B, C (kapitoly ...)") mají
// v textu vypsané POZOROVANÉ tvary - vytáhneme je jako klikací chips
// místo prázdného pole, kam by se muselo hádat nazpaměť.
function parseDriftForms(text) {
  const m = text.match(/různě:\s*(.+?)\s*\(kapitoly/i);
  if (!m) return null;
  return m[1].split(',').map(s => s.trim()).filter(Boolean);
}

function renderRow(q) {
  const scope = q.chapter_idx != null ? `kapitola ${q.chapter_idx}` : 'globální';
  const sevBadge = el('span', {
    class: 'badge ' + (q.severity === 'blocking' ? 'badge-blocking' : 'badge-guess'),
    text: q.severity,
  });
  const scopeCell = el('td', {}, [
    sevBadge,
    el('div', { class: 'scope', text: `${q.kind} / ${scope}` }),
  ]);
  const textCell = el('td', { text: q.text });

  const input = el('input', { type: 'text', value: q.guess_answer || '' });
  const answerCell = el('td');
  const driftForms = parseDriftForms(q.text);
  if (driftForms && driftForms.length > 1) {
    // Multi-select - drift otázky mívají VÍC platných tvarů zároveň
    // (skloňování), ne jen jeden správný. Vybrané se skládají do
    // pole ve stejném pořadí, jak je nabídl nástroj (první = kanonický).
    const selected = new Set();
    const chipsWrap = el('div', { class: 'chips' });
    const chipEls = [];
    function syncInput() {
      input.value = driftForms.filter(f => selected.has(f)).join(' | ');
    }
    for (const form of driftForms) {
      const chip = el('button', { class: 'chip', text: form });
      chip.addEventListener('click', (ev) => {
        ev.preventDefault();
        if (selected.has(form)) { selected.delete(form); chip.classList.remove('active'); }
        else { selected.add(form); chip.classList.add('active'); }
        syncInput();
      });
      chipEls.push(chip);
      chipsWrap.appendChild(chip);
    }
    const allBtn = el('button', { class: 'chip', text: 'Vše správně' });
    allBtn.addEventListener('click', (ev) => {
      ev.preventDefault();
      driftForms.forEach(f => selected.add(f));
      chipEls.forEach(c => c.classList.add('active'));
      syncInput();
    });
    chipsWrap.appendChild(allBtn);
    answerCell.appendChild(chipsWrap);
  }
  answerCell.appendChild(input);

  const msg = el('div', { class: 'row-msg' });
  const actionRow = el('div', { class: 'action-row' });
  const actionCell = el('td', {}, [actionRow, msg]);

  const row = el('tr', { class: 'row', 'data-qid': q.id }, [
    scopeCell, textCell, answerCell, actionCell,
  ]);
  if (discussSet.has(q.id)) row.classList.add('discuss');

  function markDone(label) {
    row.classList.add('done');
    row.classList.remove('discuss');
    input.disabled = true;
    actionRow.querySelectorAll('button').forEach(b => b.disabled = true);
    msg.textContent = label;
    msg.classList.add('ok');
  }

  async function submitAnswer(text) {
    msg.textContent = '';
    msg.className = 'row-msg';
    let r, body;
    try {
      r = await fetch('/api/answer', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ qid: q.id, text }),
      });
      body = await r.json();
    } catch (e) {
      msg.textContent = 'Chyba spojení - zkus znovu.';
      msg.classList.add('error');
      return;
    }
    if (!r.ok) {
      msg.textContent = body.error || 'Nepodařilo se uložit.';
      msg.classList.add('error');
      return;
    }
    markDone('Zapsáno.');
    if (body.requeued && body.requeued.length) {
      showBanner(`Přepočítat kapitoly: ${body.requeued.join(', ')} (spusť run).`);
    } else if (body.chapter_status_changed) {
      showBanner('Kapitola uvolněna k překladu (spusť run).');
    }
  }

  const hasConfirmShortcut = isConfirmQuestion(q.text) && !!q.guess_answer;
  if (hasConfirmShortcut) {
    const yesBtn = el('button', { class: 'primary', text: '✓ Ano' });
    yesBtn.addEventListener('click', () => submitAnswer(q.guess_answer));
    actionRow.appendChild(yesBtn);
  }

  const saveBtn = el('button', { class: hasConfirmShortcut ? 'ghost' : 'primary', text: 'Uložit' });
  saveBtn.addEventListener('click', () => submitAnswer(input.value));
  actionRow.appendChild(saveBtn);

  const dismissBtn = el('button', { class: 'danger-ghost small', text: 'Zahodit (šum)' });
  dismissBtn.addEventListener('click', async () => {
    msg.textContent = '';
    msg.className = 'row-msg';
    let r, body;
    try {
      r = await fetch('/api/dismiss', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ qid: q.id, note: 'ruční zahození z UI' }),
      });
      body = await r.json();
    } catch (e) {
      msg.textContent = 'Chyba spojení - zkus znovu.';
      msg.classList.add('error');
      return;
    }
    if (!r.ok) {
      msg.textContent = body.error || 'Nepodařilo se zahodit.';
      msg.classList.add('error');
      return;
    }
    markDone('Zahozeno.');
  });
  actionRow.appendChild(dismissBtn);

  const discussBtn = el('button', { class: 'ghost small', text: 'K diskuzi' });
  discussBtn.addEventListener('click', () => {
    if (discussSet.has(q.id)) {
      discussSet.delete(q.id);
      row.classList.remove('discuss');
    } else {
      discussSet.add(q.id);
      row.classList.add('discuss');
    }
    saveDiscussSet(discussSet);
  });
  actionRow.appendChild(discussBtn);

  return row;
}

async function load() {
  const tbody = document.getElementById('q-body');
  let r, rows;
  try {
    r = await fetch('/api/questions');
    rows = await r.json();
  } catch (e) {
    tbody.innerHTML = '';
    tbody.appendChild(el('tr', {}, [el('td', { colspan: '4', text: 'Chyba načtení.' })]));
    return;
  }
  if (!rows.length) {
    document.getElementById('empty').style.display = 'block';
    document.getElementById('q-table').style.display = 'none';
    return;
  }
  tbody.innerHTML = '';
  for (const q of rows) tbody.appendChild(renderRow(q));
}

load();
</script>
</body>
</html>
