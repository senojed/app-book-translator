<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Polish review</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 1.5rem;
        background: #f7f7f5; color: #1a1a1a; }
  h1 { font-size: 1.3rem; }
  /* Tab-navigace mezi kapitolami (UI kolo polish-ui-v2, bod 4) - jen JEDNA
     kapitola je vidět naráz, tahle lišta pilulek přepíná, kterou. */
  .tabs { display: flex; gap: .4rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .tab { padding: .35rem .8rem; border: 1px solid #ccc; border-radius: 999px;
        background: #fff; cursor: pointer; font-size: .85rem; }
  .tab.stale { border-color: #d9822b; color: #b35c00; }
  .tab.active { background: #1a6b3c; color: #fff; border-color: #1a6b3c; }
  .chapter { background: #fff; border: 1px solid #ddd; border-radius: 8px;
            padding: 1rem; margin-bottom: 1.5rem; }
  .chapter.stale { border-color: #d9822b; background: #fff8ee; }
  .stale-msg { color: #b35c00; font-weight: 600; margin-bottom: .5rem; }
  .findings { font-size: .85rem; color: #555; margin-bottom: .5rem; }
  .findings li { margin-bottom: .2rem; }
  .panes { display: flex; gap: 1rem; align-items: stretch; }
  .pane { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .pane h4 { margin: 0 0 .3rem; font-size: .8rem; text-transform: uppercase;
            color: #888; }
  /* Sdílená pevná výška (bod 3) - VŠECHNY panely v řádku kapitoly mají
     stejnou výšku, ať uz jde o <pre>, <textarea>, nebo diff <div>. */
  .pane-content { height: 320px; box-sizing: border-box; font-family: inherit;
            font-size: .95rem; white-space: pre-wrap; padding: .5rem;
            border: 1px solid #ccc; border-radius: 4px; overflow-y: auto; }
  .pane pre.pane-content, .pane div.pane-content { background: #fafafa; margin: 0; }
  /* Editovatelný panel: JEN horizontální resize (bod 3) - výška zůstává
     zamčená na výšku řádku, uživatel může roztáhnout jen šířku. */
  .pane textarea.pane-content { background: #fff; width: 100%; resize: horizontal; }
  .diff-box .diff-del { text-decoration: line-through; color: #b3261e;
            background: #fbe4e2; }
  .diff-box .diff-add { color: #1a6b3c; background: #e3f3e9; }
  .diff-too-big { color: #888; font-style: italic; margin: 0; }
  .buttons { margin-top: .5rem; display: flex; gap: .5rem; flex-wrap: wrap; }
  button { cursor: pointer; border: 1px solid #ccc; background: #fff;
          border-radius: 4px; padding: .4rem .8rem; font-size: .85rem; }
  button.primary { background: #1a6b3c; color: #fff; border-color: #1a6b3c; }
  button.danger { background: #b3261e; color: #fff; border-color: #b3261e; }
  .error { color: #b3261e; font-size: .85rem; margin-top: .3rem; }
  #history table { width: 100%; border-collapse: collapse; font-size: .85rem; }
  #history td, #history th { padding: .3rem .5rem; border-bottom: 1px solid #eee;
                             text-align: left; }
  #find-idx { padding: .3rem; }
</style>
</head>
<body>
<h1>Polish review</h1>
<div id="tabs" class="tabs"></div>
<div id="chapters"></div>

<h2>Historie</h2>
<div>
  Najít historii kapitoly č. <input id="find-idx" type="number" min="1">
  <button id="find-btn">Hledat</button>
</div>
<div id="history"></div>

<script>
// Kolo 1 plán-ping-pongu BLOCKING - `title`/`issue`/`cz_before`/`styled`/
// `raw_text` jsou Codexem-odvozený nebo z knihy převzatý (nedůvěryhodný,
// prompt-injectable) text. CELÁ tahle stránka proto staví DOM VÝHRADNĚ přes
// `createElement`+`textContent` (nikdy `innerHTML` s interpolovaným textem)
// a posluchače přes `addEventListener` s daty v JS closure (nikdy inline
// `onclick="..."` s `JSON.stringify` uvnitř HTML atributu - to by šlo
// prolomit uvozovkou v samotném textu a spustit libovolný JS/žádost). Diff
// preview (UI kolo polish-ui-v2, bod 2) drží stejnou disciplínu - i tam jde
// o nedůvěryhodný text (originál i ručně/Codexem upravená verze).
let LAST = { chapters: [], history: [] };
let activeIdx = null;          // idx aktuálně zobrazené kapitoly (tab-nav)
let CARD_ELS = {};             // idx -> DOM div kapitoly (přepínání beze ztráty rozepsané editace)
let TAB_ELS = {};              // idx -> DOM tlačítko záložky

async function load() {
  const r = await fetch('/api/polish');
  const body = await r.json().catch(() => ({}));
  // Kolo 6 plán-ping-pongu IMPORTANT - dřív `load()` nekontrolovalo
  // `r.ok`, takže server-side 500 (poškozený draft/historie) nastavilo
  // `LAST` na `{error: ...}` a `LAST.chapters.length` spadlo v JS -
  // pečlivě formulovaná server chyba tak nikdy nebyla vidět.
  if (!r.ok) {
    document.getElementById('tabs').textContent = '';
    const root = document.getElementById('chapters');
    root.textContent = '';
    root.appendChild(el('p', { class: 'error', text: body.error || `HTTP ${r.status}` }));
    document.getElementById('history').textContent = '';
    return;
  }
  LAST = body;
  renderChapters();
  renderHistory(LAST.history);
}

async function loadHistory(idx) {
  const r = await fetch('/api/polish?idx=' + encodeURIComponent(idx));
  const body = await r.json().catch(() => ({}));
  // Kolo 8 plán-ping-pongu IMPORTANT - stejná chyba jako `load()` před
  // kolem 6 opravou: bez `r.ok` kontroly by 500 (poškozená historie)
  // spadlo v JS na `undefined.history` místo zobrazení chyby.
  if (!r.ok) {
    alert(body.error || `HTTP ${r.status}`);
    return;
  }
  renderHistory(body.history);
}

function el(tag, opts, children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(opts || {})) {
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else e.setAttribute(k, v);
  }
  for (const c of children || []) e.appendChild(c);
  return e;
}

// --- Slovní LCS diff pro živý náhled rozdílu (bod 2) ---------------------

// Ochrana proti O(n*m) LCS tabulce na obřím textu (kolo polish-ui-v2) -
// klasická slovní LCS je kvadratická v počtu tokenů. Nad `DIFF_TOKEN_CAP`
// tokenů na jedné straně bychom alokovali desítky MB a diff by mohl trvat
// citelně dlouho i po debounce - radši ukázat kratší hlášku, než nechat
// stránku sekat při psaní v dlouhé kapitole. Zjednodušení oproti zadání
// (žádný "coarser" fallback diff, jen jasná zpráva "moc velké na náhled").
const DIFF_TOKEN_CAP = 6000;

function tokenizeWords(s) {
  // Zachovává mezery jako VLASTNÍ tokeny (split se zachytávací skupinou),
  // aby diff četl jako přirozený text, ne jako slova bez mezer mezi sebou.
  return (s || '').split(/(\s+)/).filter(t => t.length > 0);
}

function diffWords(before, after) {
  const a = tokenizeWords(before);
  const b = tokenizeWords(after);
  if (a.length > DIFF_TOKEN_CAP || b.length > DIFF_TOKEN_CAP) return null;
  const n = a.length, m = b.length, w = m + 1;
  const dp = new Uint16Array((n + 1) * w);
  for (let i = 1; i <= n; i++) {
    for (let j = 1; j <= m; j++) {
      dp[i * w + j] = (a[i - 1] === b[j - 1])
        ? dp[(i - 1) * w + (j - 1)] + 1
        : Math.max(dp[(i - 1) * w + j], dp[i * w + (j - 1)]);
    }
  }
  const ops = [];
  let i = n, j = m;
  while (i > 0 && j > 0) {
    if (a[i - 1] === b[j - 1]) { ops.push({ type: 'equal', text: a[i - 1] }); i--; j--; }
    else if (dp[(i - 1) * w + j] >= dp[i * w + (j - 1)]) { ops.push({ type: 'del', text: a[i - 1] }); i--; }
    else { ops.push({ type: 'add', text: b[j - 1] }); j--; }
  }
  while (i > 0) ops.push({ type: 'del', text: a[--i] });
  while (j > 0) ops.push({ type: 'add', text: b[--j] });
  ops.reverse();
  return ops;
}

function renderDiff(container, before, after) {
  container.textContent = '';
  const ops = diffWords(before, after);
  if (ops === null) {
    container.appendChild(el('p', { class: 'diff-too-big',
      text: 'Náhled rozdílu je pro tak dlouhý text vypnutý (moc velké na živé porovnání).' }));
    return;
  }
  for (const op of ops) {
    if (op.type === 'equal') {
      container.appendChild(document.createTextNode(op.text));   // textContent-ekvivalent, ne innerHTML
    } else {
      container.appendChild(el('span',
        { class: op.type === 'del' ? 'diff-del' : 'diff-add', text: op.text }));
    }
  }
}

// --- Vykreslení kapitol + tab-navigace (bod 4) ---------------------------

function renderChapters() {
  const tabsRoot = document.getElementById('tabs');
  const root = document.getElementById('chapters');
  tabsRoot.textContent = '';
  root.textContent = '';
  CARD_ELS = {};
  TAB_ELS = {};
  if (LAST.chapters.length === 0) {
    activeIdx = null;
    root.appendChild(el('p', { text: 'Žádné kapitoly nečekají na review.' }));
    return;
  }
  // Aktivní kapitola zmizela (uložena/zahozena/revertnuta jinde) - spadni
  // na první zbývající, přesně jak dřív dělal plochý seznam (ten prostě
  // ukázal všechny zbývající, tady ukazujeme první z nich).
  if (!LAST.chapters.some(c => c.idx === activeIdx)) {
    activeIdx = LAST.chapters[0].idx;
  }
  for (const ch of LAST.chapters) {
    const tab = el('button', { class: 'tab' + (ch.stale ? ' stale' : ''),
      text: `#${ch.idx} - ${ch.title}` });
    tab.addEventListener('click', () => switchTab(ch.idx));
    TAB_ELS[ch.idx] = tab;
    tabsRoot.appendChild(tab);

    const card = chapterCard(ch);
    CARD_ELS[ch.idx] = card;
    root.appendChild(card);
  }
  switchTab(activeIdx);
}

function switchTab(idx) {
  // Přepnutí NIKDY nepřestavuje karty (na rozdíl od `renderChapters`) -
  // jen mění `hidden`, takže rozepsaná editace v jiné, právě opuštěné
  // kapitole zůstává zachovaná, dokud nepřijde další `load()`.
  activeIdx = idx;
  for (const [i, tab] of Object.entries(TAB_ELS)) {
    tab.classList.toggle('active', Number(i) === idx);
  }
  for (const [i, card] of Object.entries(CARD_ELS)) {
    card.hidden = Number(i) !== idx;
  }
}

function chapterCard(ch) {
  const div = el('div', { class: 'chapter' + (ch.stale ? ' stale' : '') });
  div.appendChild(el('h3', { text: `#${ch.idx} - ${ch.title}` }));
  if (ch.stale) {
    // Kolo 7 plán-ping-pongu IMPORTANT - `already_committed_kept_original`
    // dřív sdílelo hlášku s `likely_committed_without_history` ("chybí
    // záznam, zkontroluj ručně"), i když je to OČEKÁVANÝ, potvrzený stav
    // (originál byl ponechán, jen se nepovedlo odebrat draft z fronty) -
    // vlastní, méně poplašná zpráva.
    const msgs = {
      already_committed_has_history:
        'Tahle kapitola už byla uložena (viz historie), zbývá jen odebrat z fronty.',
      already_committed_kept_original:
        'Rozhodnutí "ponechat originál" už bylo potvrzeno (viz poznámka v knize), jen se nepovedlo odebrat z fronty - klidně zahoď.',
    };
    const msg = msgs[ch.reason]
      || 'Tahle kapitola byla pravděpodobně už uložena, ale chybí záznam v historii (revert pro ni nepůjde) - zkontroluj text v knize ručně.';
    div.appendChild(el('div', { class: 'stale-msg', text: msg }));
  }
  const findings = el('ul', { class: 'findings' },
    (ch.findings || []).map(f => el('li', {
      text: `[${f.severity || '?'}] ${f.issue || '(bez popisu)'}` })));
  div.appendChild(findings);

  // Čtvrtý panel (bod 1) - anglický originál pro kontext. `raw_text` může
  // chybět/být `null` (kapitola mezitím zmizela z DB - server to teď hlídá
  // stejně jako u `_stale_info`), ukaž srozumitelnou náhradu místo pádu.
  const enPre = el('pre', { class: 'pane-content',
    text: ch.raw_text != null ? ch.raw_text : '(originál nedostupný)' });
  const origPre = el('pre', { class: 'pane-content', text: ch.cz_before });
  const textarea = el('textarea', { class: 'pane-content' });
  textarea.value = ch.styled;
  // Živý diff náhled (bod 2) - samostatný read-only panel, NE inline
  // zvýrazňování uvnitř textarey (křehké, netriviální na spolehlivost).
  const diffBox = el('div', { class: 'pane-content diff-box' });

  const panes = el('div', { class: 'panes' }, [
    el('div', { class: 'pane' }, [el('h4', { text: 'Originál EN' }), enPre]),
    el('div', { class: 'pane' }, [el('h4', { text: 'Originál CZ' }), origPre]),
    el('div', { class: 'pane' }, [el('h4', { text: 'Návrh (editovatelné)' }), textarea]),
    el('div', { class: 'pane' }, [el('h4', { text: 'Rozdíl CZ originál vs. návrh' }), diffBox]),
  ]);
  div.appendChild(panes);

  let diffTimer = null;
  const refreshDiff = () => renderDiff(diffBox, ch.cz_before, textarea.value);
  const scheduleDiff = () => {
    // Lehký debounce (150-200 ms) - nepočítat LCS na KAŽDÝ stisk klávesy
    // u dlouhé kapitoly, jen když psaní na chvíli ustane.
    clearTimeout(diffTimer);
    diffTimer = setTimeout(refreshDiff, 180);
  };
  refreshDiff();   // počáteční diff (originál vs. Codexův návrh), bez čekání na debounce
  textarea.addEventListener('input', scheduleDiff);

  const errBox = el('div', { class: 'error' });
  const btnOrig = el('button', { text: 'Vrať na originál' });
  btnOrig.addEventListener('click', () => { textarea.value = ch.cz_before; refreshDiff(); });
  const btnCodex = el('button', { text: 'Vrať na Codex' });
  btnCodex.addEventListener('click', () => { textarea.value = ch.styled; refreshDiff(); });
  const btnApply = el('button', { class: 'primary', text: 'Uložit tuhle kapitolu' });
  btnApply.addEventListener('click', () => applyChapter(ch.idx, textarea, errBox));
  const btnDiscard = el('button', { class: 'danger', text: 'Zahodit' });
  btnDiscard.addEventListener('click', () => discardChapter(ch.idx, errBox));
  div.appendChild(el('div', { class: 'buttons' }, [btnOrig, btnCodex, btnApply, btnDiscard]));
  div.appendChild(errBox);
  return div;
}

async function applyChapter(idx, textarea, errBox) {
  const r = await fetch('/api/polish/apply', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ idx, text: textarea.value }),
  });
  if (r.ok) { load(); return; }
  const body = await r.json().catch(() => ({}));
  errBox.textContent = body.error || `HTTP ${r.status}`;
}

async function discardChapter(idx, errBox) {
  if (!confirm('Zahodit tenhle návrh? Text v knize se nezmění.')) return;
  const r = await fetch('/api/polish/discard', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ idx }),
  });
  // Kolo 8 plán-ping-pongu IMPORTANT - dřív se odpověď ignorovala úplně,
  // takže selhání zápisu draftu (teď ošetřené serverem výš) nebylo v UI
  // vidět vůbec - `load()` prostě proběhlo, jako by se nic nestalo.
  if (r.ok) { load(); return; }
  const body = await r.json().catch(() => ({}));
  errBox.textContent = body.error || `HTTP ${r.status}`;
}

async function revertChapter(idx, to) {
  const r = await fetch('/api/polish/revert', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ idx, to }),
  });
  if (r.ok) { load(); return; }
  const body = await r.json().catch(() => ({}));
  alert(body.error || `HTTP ${r.status}`);
}

function renderHistory(entries) {
  const root = document.getElementById('history');
  root.textContent = '';
  if (!entries.length) {
    root.appendChild(el('p', { text: 'Zatím žádná historie.' }));
    return;
  }
  // "vrať zpět"/"vrať na původní" - NIKDY lokální "je tohle nejnovější"
  // heuristika (kolo 12 plán-ping-pongu BLOCKING - dřív `seenIdx` s
  // "první výskyt idx = nejnovější" fungovalo JEN pro nefiltrovaný GET
  // (server tam řadí nejnovější-první); `GET ?idx=N` ale vrací pole v
  // POŘADÍ VLOŽENÍ do historie, tedy NEJSTARŠÍ první - stejný trik by u
  // dohledané kapitoly skryl tlačítka u SKUTEČNĚ posledního záznamu a
  // ukázal je u nejstaršího). Server je JEDINÝ zdroj pravdy - `_annotate_
  // history` (kolo 6/20/22) nastavuje `can_revert_previous`/`can_revert_
  // original`/`stale` podle IDENTITY objektu v `full_entries` (`find_
  // latest(...) is e`), NE podle pozice v tomhle poli, takže čtení
  // přímo z `e.*` je SPRÁVNÉ bez ohledu na pořadí/filtr.
  const table = el('table');
  table.appendChild(el('tr', {}, [
    el('th', { text: '#' }), el('th', { text: 'Kdy' }),
    el('th', { text: 'Zdroj' }), el('th', {})]));
  for (const e of entries) {
    const btnCell = el('td');
    if (e.can_revert_previous) {
      const b = el('button', { text: 'Vrať zpět' });
      b.addEventListener('click', () => revertChapter(e.idx, 'previous'));
      btnCell.appendChild(b);
    }
    if (e.can_revert_original) {
      const b = el('button', { text: 'Vrať na původní' });
      b.addEventListener('click', () => revertChapter(e.idx, 'original'));
      btnCell.appendChild(b);
    }
    table.appendChild(el('tr', {}, [
      el('td', { text: String(e.idx) }), el('td', { text: e.applied_at }),
      el('td', { text: e.source }), btnCell]));
    if (e.stale) {
      // Kolo 6 plán-ping-pongu BLOCKING - `_annotate_history` teď
      // aktivně porovnává DB text s posledním historie-záznamem (dřív
      // to dělala jen draftová `_stale_info`, co revert nikdy nezachytí
      // - revert žádný draft nevytváří).
      table.appendChild(el('tr', {}, [el('td', { colspan: '4', class: 'stale-msg',
        text: `#${e.idx}: DB neodpovídá historii - poslední zápis do historie ` +
              'pravděpodobně selhal PO uložení textu do knihy. Zkontroluj text ' +
              'ručně; revert/apply pro tuhle kapitolu nemusí fungovat spolehlivě, ' +
              'dokud nesoulad nevyřešíš.' })]));
    }
  }
  root.appendChild(table);
}

document.getElementById('find-btn').addEventListener('click', () => {
  const v = Number(document.getElementById('find-idx').value);
  if (v > 0) loadHistory(v);
});

load();
</script>
</body>
</html>
